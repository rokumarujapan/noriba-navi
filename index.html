<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>のりばナビ | Noriba Navi</title>
<meta name="description" content="バスの「のりば番号」がひと目でわかる案内アプリ。東京都交通局の公式GTFSデータを使用。">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header class="app-header">
    <div class="app-header-top">
      <div>
        <h1 id="app-title">のりばナビ</h1>
        <p id="app-tagline">バスの「のりば番号」がひと目でわかる</p>
      </div>
      <div class="lang-switch">
        <button class="lang-btn" data-lang="ja">JA</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="ko">한국어</button>
      </div>
    </div>
    <!-- ROUTE BAR: 出発/到着 の縦積み(乗換案内アプリ式)。出発をタップすると出発地選択モーダルが開く -->
    <div class="route-bar">
      <button class="route-row route-row-from" id="change-origin-btn">
        <span class="route-tag route-tag-from" id="route-from-label">出発</span>
        <span class="route-value" id="origin-current-label"></span>
      </button>
      <div class="route-arrow-down" aria-hidden="true">↓</div>
      <div class="route-row route-row-to">
        <span class="route-tag route-tag-to" id="route-to-label">到着</span>
        <input type="text" id="search-input" placeholder="行き先を入力・選択">
      </div>
    </div>
    <button class="gps-quick-btn" id="gps-btn"><span aria-hidden="true">📍</span><span id="gps-label">現在地</span></button>
  </header>

  <main class="app-body">

    <!-- HOME VIEW -->
    <section id="home-view">
      <div id="fav-section"></div>
      <h2 class="section-title" id="all-dest-title">品川駅高輪口 発</h2>
      <div id="dest-list"></div>
    </section>

    <!-- DETAIL VIEW -->
    <section id="detail-view" hidden>
      <div class="detail-header">
        <button class="back-btn" id="back-btn">← 戻る</button>
        <div class="result-summary">
          <div class="result-line"><span class="route-tag route-tag-from">発</span><span id="detail-origin-name"></span></div>
          <div class="result-line"><span class="route-tag route-tag-to">着</span><span id="detail-dest-name"></span></div>
        </div>
        <div class="detail-badges">
          <span class="badge badge-route" id="detail-route-badge"></span>
          <span class="badge badge-platform" id="detail-platform-badge"></span>
          <span id="detail-travel"></span>
        </div>
        <p id="detail-via" hidden></p>
        <p id="detail-headsign-note"></p>
        <button class="fav-btn" id="detail-fav-btn"></button>
      </div>

      <div id="next-departures"></div>

      <button class="view-tt-btn" id="view-timetable-btn">時刻表をすべて見る</button>

      <!-- MAP: shown here, below the departure times, only once a destination is searched -->
      <div id="map"></div>
      <p class="map-note" id="map-note">地図データ: © OpenStreetMap contributors</p>
    </section>

  </main>

  <footer class="app-footer" id="attribution"></footer>

  <!-- TIMETABLE MODAL -->
  <div id="tt-modal" hidden>
    <div class="tt-sheet">
      <div class="tt-sheet-header">
        <h3 id="tt-title"></h3>
        <button class="tt-close-btn" id="tt-close-btn">閉じる</button>
      </div>
      <div class="tt-tabs" id="tt-tabs"></div>
      <div id="tt-count"></div>
      <div id="tt-body"></div>
    </div>
  </div>

  <!-- ORIGIN (START POINT) MODAL -->
  <div id="origin-modal" hidden>
    <div class="tt-sheet origin-sheet">
      <div class="tt-sheet-header">
        <h3 id="origin-modal-title"></h3>
        <button class="tt-close-btn" id="origin-close-btn"></button>
      </div>
      <div class="tt-tabs" id="origin-tabs">
        <button class="tt-tab" data-origin-tab="gps"></button>
        <button class="tt-tab" data-origin-tab="map"></button>
        <button class="tt-tab" data-origin-tab="text"></button>
      </div>

      <div class="origin-tab-panel" id="origin-tab-gps">
        <button class="view-tt-btn" id="origin-gps-btn"></button>
      </div>

      <div class="origin-tab-panel" id="origin-tab-map" hidden>
        <p class="origin-hint" id="origin-map-hint"></p>
        <div id="origin-map"></div>
      </div>

      <div class="origin-tab-panel" id="origin-tab-text" hidden>
        <div class="origin-search-row">
          <input type="text" id="origin-search-input">
          <button class="gps-btn" id="origin-search-btn">🔍</button>
        </div>
        <div id="origin-search-results"></div>
      </div>
    </div>
  </div>

  <div id="gps-toast" hidden></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
